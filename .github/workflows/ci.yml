name: CI - API Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'api/**'
      - '.github/workflows/**'
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - '.github/workflows/**'

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      TIMEOUT_SECONDS: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest-xdist pytest-cov pytest-html

      - name: Run tests (pytest + HTML)
        run: |
          python -m pytest -vv -n auto \
            --html=tests/reports/report.html --self-contained-html

      - name: Coverage
        run: |
          python -m pytest -vv --cov=src --cov-report=term --cov-report=html:tests/reports/coverage

      - name: Upload artifacts (pytest report + coverage)
        uses: actions/upload-artifact@v4
        with:
          name: api-reports
          path: |
            api/tests/reports/report.html
            api/tests/reports/coverage/
          if-no-files-found: warn
